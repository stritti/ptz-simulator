[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "ptzsim"
version = "0.8.0"
description = "CLI simulator for testing ONVIF, VISCA and NDI PTZ clients"
readme = "README.md"
# SPDX expressions in project.license require setuptools 77, which drops Python 3.8.
# Keep license metadata in setup.cfg for compatibility with the supported Python versions.
dynamic = ["license"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/stritti/ptz-simulator"
Documentation = "https://stritti.github.io/ptz-simulator/"
Changelog = "https://github.com/stritti/ptz-simulator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ndi = ["ndi-python", "numpy"]
# The keyboard UI uses curses, which the Windows Python does not ship.
tui = ["windows-curses; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=5.0.0",
    "numpy; python_version >= '3.9'",  # test the NDI scene renderer without the NDI runtime
]
onvif-client = ["onvif-zeep-async"]

[project.scripts]
ptzsim = "ptzsim.cli:main"

[tool.setuptools]
packages = ["ptzsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ptzsim --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["ptzsim"]

[tool.coverage.report]
fail_under = 80
show_missing = true
