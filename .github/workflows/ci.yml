name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked pytest

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Build wheel, sdist and ptzsim.pyz
        run: ./scripts/build-release.sh
      - name: Smoke-test the standalone ptzsim.pyz
        run: python3 dist/ptzsim.pyz send --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
