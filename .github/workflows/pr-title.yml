# Quality gate for Release Please: PR title and all commits of the PR must
# follow Conventional Commits with a type from release-please-config.json.

name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_conventional_commits.py "$PR_TITLE"
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA" \
            | python3 scripts/check_conventional_commits.py -
