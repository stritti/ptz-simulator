name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please bumps pyproject.toml and ptzsim/__init__.py but not uv.lock,
      # which would make `uv run --locked` fail on the release PR.
      - name: Check out the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.release.outputs.prs_created == 'true'
      - name: Sync uv.lock with the new version
        if: steps.release.outputs.prs_created == 'true'
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update uv.lock"
            git push
          fi

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build wheel, sdist and ptzsim.pyz
        run: ./scripts/build-release.sh
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Enable once a PyPI trusted publisher exists for this repository
  # (workflow release-please.yml, environment pypi): set the repository
  # variable PYPI_PUBLISH to "true".
  pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ptzsim/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Keep only wheel and sdist
        run: rm -f dist/ptzsim.pyz
      - uses: pypa/gh-action-pypi-publish@release/v1
